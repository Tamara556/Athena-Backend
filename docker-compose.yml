# Athena Backend — full local stack (V2: + Kafka, Redis, Learning & Badge services).
#
#   docker compose up --build
#
# Each business service owns its OWN Postgres instance (no shared DB).
# The gateway is the only port you normally call from outside: http://localhost:8080
# Kafka is reachable from the host on localhost:29092 (services use kafka:9092 internally).
name: athena

x-jwt-secret: &jwt-secret "local-dev-secret-change-me-please-0123456789abcdef"

x-cloudwatch-env: &cloudwatch-env
  ATHENA_LOGGING_CLOUDWATCH_ENABLED: "${ATHENA_LOGGING_CLOUDWATCH_ENABLED:-true}"
  ATHENA_LOGGING_CLOUDWATCH_ENDPOINT: "${ATHENA_LOGGING_CLOUDWATCH_ENDPOINT:-http://host.docker.internal:4566}"
  ATHENA_LOGGING_CLOUDWATCH_REGION: "us-east-1"
  ATHENA_LOGGING_CLOUDWATCH_ACCESS_KEY: "test"
  ATHENA_LOGGING_CLOUDWATCH_SECRET_KEY: "test"

services:

  # ---------- Infrastructure ----------
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: athena-discovery
    environment:
      EUREKA_HOSTNAME: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8761"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kafka:
    image: apache/kafka:3.9.1
    container_name: athena-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: athena-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-db:
    image: postgres:17-alpine
    container_name: athena-auth-db
    environment:
      POSTGRES_DB: athena_auth
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena_auth"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-db:
    image: postgres:17-alpine
    container_name: athena-user-db
    environment:
      POSTGRES_DB: athena_user
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
    ports:
      - "5434:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena_user"]
      interval: 10s
      timeout: 5s
      retries: 10

  progress-db:
    image: postgres:17-alpine
    container_name: athena-progress-db
    environment:
      POSTGRES_DB: athena_progress
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
    ports:
      - "5435:5432"
    volumes:
      - progress-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena_progress"]
      interval: 10s
      timeout: 5s
      retries: 10

  learning-db:
    image: postgres:17-alpine
    container_name: athena-learning-db
    environment:
      POSTGRES_DB: athena_learning
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
    ports:
      - "5436:5432"
    volumes:
      - learning-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena_learning"]
      interval: 10s
      timeout: 5s
      retries: 10

  badge-db:
    image: postgres:17-alpine
    container_name: athena-badge-db
    environment:
      POSTGRES_DB: athena_badge
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
    ports:
      - "5437:5432"
    volumes:
      - badge-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena_badge"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-db:
    image: postgres:17-alpine
    container_name: athena-ai-db
    environment:
      POSTGRES_DB: athena_ai
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
    ports:
      - "5438:5432"
    volumes:
      - ai-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena_ai"]
      interval: 10s
      timeout: 5s
      retries: 10

  interview-db:
    image: postgres:17-alpine
    container_name: athena-interview-db
    environment:
      POSTGRES_DB: athena_interview
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
    ports:
      - "5439:5432"
    volumes:
      - interview-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena_interview"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Business services ----------
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: athena-auth-service
    environment:
      <<: *cloudwatch-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/athena_auth
      SPRING_DATASOURCE_USERNAME: athena
      SPRING_DATASOURCE_PASSWORD: athena
      EUREKA_URI: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ATHENA_JWT_SECRET: *jwt-secret
      ATHENA_STORAGE_S3_ENDPOINT: "${ATHENA_STORAGE_S3_ENDPOINT:-http://host.docker.internal:4566}"
      ATHENA_STORAGE_S3_REGION: "us-east-1"
      ATHENA_STORAGE_S3_ACCESS_KEY: "test"
      ATHENA_STORAGE_S3_SECRET_KEY: "test"
      ATHENA_STORAGE_S3_BUCKET: "athena-user-images"
      LOGGING_STRUCTURED_FORMAT: ecs
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: athena-user-service
    environment:
      <<: *cloudwatch-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/athena_user
      SPRING_DATASOURCE_USERNAME: athena
      SPRING_DATASOURCE_PASSWORD: athena
      EUREKA_URI: http://discovery-server:8761/eureka/
      LOGGING_STRUCTURED_FORMAT: ecs
    ports:
      - "8082:8082"
    depends_on:
      user-db:
        condition: service_healthy
      discovery-server:
        condition: service_started

  progress-service:
    build:
      context: .
      dockerfile: progress-service/Dockerfile
    container_name: athena-progress-service
    environment:
      <<: *cloudwatch-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://progress-db:5432/athena_progress
      SPRING_DATASOURCE_USERNAME: athena
      SPRING_DATASOURCE_PASSWORD: athena
      EUREKA_URI: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      LOGGING_STRUCTURED_FORMAT: ecs
    ports:
      - "8083:8083"
    depends_on:
      progress-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy
      redis:
        condition: service_started

  learning-service:
    build:
      context: .
      dockerfile: learning-service/Dockerfile
    container_name: athena-learning-service
    environment:
      <<: *cloudwatch-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://learning-db:5432/athena_learning
      SPRING_DATASOURCE_USERNAME: athena
      SPRING_DATASOURCE_PASSWORD: athena
      EUREKA_URI: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOGGING_STRUCTURED_FORMAT: ecs
    ports:
      - "8084:8084"
    depends_on:
      learning-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy

  badge-service:
    build:
      context: .
      dockerfile: badge-service/Dockerfile
    container_name: athena-badge-service
    environment:
      <<: *cloudwatch-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://badge-db:5432/athena_badge
      SPRING_DATASOURCE_USERNAME: athena
      SPRING_DATASOURCE_PASSWORD: athena
      EUREKA_URI: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      LOGGING_STRUCTURED_FORMAT: ecs
    ports:
      - "8085:8085"
    depends_on:
      badge-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy
      redis:
        condition: service_started

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: athena-ai-service
    environment:
      <<: *cloudwatch-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://ai-db:5432/athena_ai
      SPRING_DATASOURCE_USERNAME: athena
      SPRING_DATASOURCE_PASSWORD: athena
      EUREKA_URI: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      ATHENA_AI_BASE_URL: ${ATHENA_AI_BASE_URL:-http://host.docker.internal:1234/v1}
      ATHENA_AI_MODEL: ${ATHENA_AI_MODEL:-qwen3-14b}
      ATHENA_AI_READ_TIMEOUT: ${ATHENA_AI_READ_TIMEOUT:-1200s}
      ATHENA_AI_MAX_TOKENS: ${ATHENA_AI_MAX_TOKENS:-8192}
      LOGGING_STRUCTURED_FORMAT: ecs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8086:8086"
    depends_on:
      ai-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy
      redis:
        condition: service_started

  interview-service:
    build:
      context: .
      dockerfile: interview-service/Dockerfile
    container_name: athena-interview-service
    environment:
      <<: *cloudwatch-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://interview-db:5432/athena_interview
      SPRING_DATASOURCE_USERNAME: athena
      SPRING_DATASOURCE_PASSWORD: athena
      EUREKA_URI: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOGGING_STRUCTURED_FORMAT: ecs
    ports:
      - "8087:8087"
    depends_on:
      interview-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: athena-api-gateway
    environment:
      <<: *cloudwatch-env
      EUREKA_URI: http://discovery-server:8761/eureka/
      ATHENA_JWT_SECRET: *jwt-secret
      ATHENA_FRONTEND_ORIGIN: ${ATHENA_FRONTEND_ORIGIN:-http://localhost:4200}
      LOGGING_STRUCTURED_FORMAT: ecs
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_started

volumes:
  auth-db-data:
  user-db-data:
  progress-db-data:
  learning-db-data:
  badge-db-data:
  ai-db-data:
  interview-db-data:
