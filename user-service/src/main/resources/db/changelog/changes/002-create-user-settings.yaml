databaseChangeLog:
  - changeSet:
      id: 002-create-user-settings
      author: athena
      changes:
        - createTable:
            tableName: user_settings
            columns:
              - column: { name: user_id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_user_settings, nullable: false } }
              - column: { name: availability, type: varchar(20), constraints: { nullable: false } }
              - column: { name: difficulty, type: varchar(20), constraints: { nullable: false } }
              - column: { name: style, type: varchar(20), constraints: { nullable: false } }
              - column: { name: tone, type: varchar(20), constraints: { nullable: false } }
              - column: { name: motivational_messages, type: boolean, constraints: { nullable: false } }
              - column: { name: weekly_reflection, type: boolean, constraints: { nullable: false } }
              - column: { name: adaptive_recommendations, type: boolean, constraints: { nullable: false } }
              - column: { name: daily_reminder, type: boolean, constraints: { nullable: false } }
              - column: { name: weekly_summary, type: boolean, constraints: { nullable: false } }
              - column: { name: interview_reminders, type: boolean, constraints: { nullable: false } }
              - column: { name: milestone_celebrations, type: boolean, constraints: { nullable: false } }
              - column: { name: personalize_history, type: boolean, constraints: { nullable: false } }
              - column: { name: share_anonymous, type: boolean, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp with time zone, constraints: { nullable: false } }
