server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: account-service
              uri: lb://auth-service
              predicates:
                - Path=/account/**
            - id: user-plans
              uri: lb://learning-service
              predicates:
                - Path=/users/*/plans
            - id: user-badges
              uri: lb://badge-service
              predicates:
                - Path=/users/*/badges
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/users/**
            - id: progress-service
              uri: lb://progress-service
              predicates:
                - Path=/progress/**
            - id: learning-plans
              uri: lb://learning-service
              predicates:
                - Path=/plans/**
            - id: learning-tasks
              uri: lb://learning-service
              predicates:
                - Path=/tasks/**
            - id: learning-sessions
              uri: lb://learning-service
              predicates:
                - Path=/sessions/**
            - id: badge-service
              uri: lb://badge-service
              predicates:
                - Path=/badges/**
            - id: rag-memory
              uri: lb://rag-service
              predicates:
                - Path=/ai/memory/**
            - id: rag-service
              uri: lb://rag-service
              predicates:
                - Path=/rag/**
            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/ai/**
            - id: learning-sessions
              uri: lb://ai-service
              predicates:
                - Path=/learning-sessions/**
            - id: daily-journey
              uri: lb://ai-service
              predicates:
                - Path=/daily-journey/**
            - id: interview-service
              uri: lb://interview-service
              predicates:
                - Path=/interviews/**

athena:
  security:
    jwt:
      secret: ${ATHENA_JWT_SECRET:local-dev-secret-change-me-please-0123456789abcdef}
      issuer: athena-auth

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      access: read-only

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT:}
  level:
    com.athena: INFO
