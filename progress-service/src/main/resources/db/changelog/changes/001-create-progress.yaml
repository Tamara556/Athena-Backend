databaseChangeLog:
  - changeSet:
      id: 001-create-learning-progress
      author: athena
      changes:
        - createTable:
            tableName: learning_progress
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_learning_progress
                    nullable: false
              - column:
                  name: total_completed_tasks
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: total_minutes
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: current_streak
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: longest_streak
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: last_activity_date
                  type: date
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
  - changeSet:
      id: 002-create-daily-progress
      author: athena
      changes:
        - createTable:
            tableName: daily_progress
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_daily_progress
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: activity_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: tasks_completed
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: minutes_spent
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: daily_progress
            columnNames: user_id, activity_date
            constraintName: uk_daily_progress_user_date
        - createIndex:
            tableName: daily_progress
            indexName: idx_daily_progress_user_date
            columns:
              - column:
                  name: user_id
              - column:
                  name: activity_date
