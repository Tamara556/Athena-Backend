server:
  port: 8081

spring:
  application:
    name: auth-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/athena_auth}
    username: ${SPRING_DATASOURCE_USERNAME:athena}
    password: ${SPRING_DATASOURCE_PASSWORD:athena}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

athena:
  security:
    jwt:
      secret: ${ATHENA_JWT_SECRET:local-dev-secret-change-me-please-0123456789abcdef}
      issuer: athena-auth
      access-token-ttl: 15m
      refresh-token-ttl: 30d
  storage:
    s3:
      enabled: ${ATHENA_STORAGE_S3_ENABLED:true}
      endpoint: ${ATHENA_STORAGE_S3_ENDPOINT:http://localhost:4566}
      region: ${ATHENA_STORAGE_S3_REGION:us-east-1}
      access-key: ${ATHENA_STORAGE_S3_ACCESS_KEY:test}
      secret-key: ${ATHENA_STORAGE_S3_SECRET_KEY:test}
      bucket: ${ATHENA_STORAGE_S3_BUCKET:athena-user-images}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT:}
  level:
    com.athena: INFO
