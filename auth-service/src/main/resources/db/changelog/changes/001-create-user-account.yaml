databaseChangeLog:
  - changeSet:
      id: 001-create-user-account
      author: athena
      changes:
        - createTable:
            tableName: user_account
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_account
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: user_account
            columnNames: email
            constraintName: uk_user_account_email
        - createTable:
            tableName: user_account_roles
            columns:
              - column:
                  name: user_account_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(20)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: user_account_roles
            columnNames: user_account_id, role
            constraintName: pk_user_account_roles
        - addForeignKeyConstraint:
            baseTableName: user_account_roles
            baseColumnNames: user_account_id
            referencedTableName: user_account
            referencedColumnNames: id
            constraintName: fk_roles_user_account
            onDelete: CASCADE
