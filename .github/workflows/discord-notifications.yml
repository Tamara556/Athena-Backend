name: Discord Notifications

on:
  pull_request:
    types: [opened, closed]
  issues:
    types: [opened]
  release:
    types: [published]
  workflow_dispatch: {}
  # TEMPORARY - for verifying Discord delivery end-to-end, removed after confirming
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  notify:
    name: "Notify #🔀・athena-contributing"
    runs-on: ubuntu-latest
    if: github.repository == 'Tamara556/Athena-Backend'
    steps:
      - name: PR opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PAYLOAD=$(jq -n \
            --arg title "🦉 Athena Contribution" \
            --arg desc "🔀 New Pull Request opened" \
            --arg pr_title "$PR_TITLE" \
            --arg author "$PR_AUTHOR" \
            --arg repo "$REPO" \
            --arg url "$PR_URL" \
            --arg ts "$TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 3066993,
                fields: [
                  { name: "Title", value: $pr_title },
                  { name: "Author", value: $author, inline: true },
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Link", value: $url }
                ],
                timestamp: $ts
              }]
            }')
          curl -sf -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"

      - name: PR closed (not merged)
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == false
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PAYLOAD=$(jq -n \
            --arg title "🦉 Athena Contribution" \
            --arg desc "❌ Pull Request closed without merging" \
            --arg pr_title "$PR_TITLE" \
            --arg author "$PR_AUTHOR" \
            --arg repo "$REPO" \
            --arg url "$PR_URL" \
            --arg ts "$TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 15158332,
                fields: [
                  { name: "Title", value: $pr_title },
                  { name: "Author", value: $author, inline: true },
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Link", value: $url }
                ],
                timestamp: $ts
              }]
            }')
          curl -sf -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"

      - name: PR merged
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PAYLOAD=$(jq -n \
            --arg title "🦉 Athena Contribution" \
            --arg desc "✅ Pull Request merged" \
            --arg pr_title "$PR_TITLE" \
            --arg author "$PR_AUTHOR" \
            --arg repo "$REPO" \
            --arg url "$PR_URL" \
            --arg ts "$TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 10181046,
                fields: [
                  { name: "Title", value: $pr_title },
                  { name: "Author", value: $author, inline: true },
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Link", value: $url }
                ],
                timestamp: $ts
              }]
            }')
          curl -sf -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"

      - name: Issue opened
        if: github.event_name == 'issues' && github.event.action == 'opened'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO: ${{ github.repository }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PAYLOAD=$(jq -n \
            --arg title "🦉 Athena Contribution" \
            --arg desc "🐛 New Issue created" \
            --arg issue_title "$ISSUE_TITLE" \
            --arg author "$ISSUE_AUTHOR" \
            --arg repo "$REPO" \
            --arg url "$ISSUE_URL" \
            --arg ts "$TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 3447003,
                fields: [
                  { name: "Title", value: $issue_title },
                  { name: "Author", value: $author, inline: true },
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Link", value: $url }
                ],
                timestamp: $ts
              }]
            }')
          curl -sf -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"

      - name: Release published
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
          REPO: ${{ github.repository }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PAYLOAD=$(jq -n \
            --arg title "🚀 Athena Release" \
            --arg version "$RELEASE_TAG" \
            --arg author "$RELEASE_AUTHOR" \
            --arg repo "$REPO" \
            --arg url "$RELEASE_URL" \
            --arg ts "$TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                color: 15844367,
                fields: [
                  { name: "Version", value: $version },
                  { name: "Released by", value: $author, inline: true },
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Link", value: $url }
                ],
                timestamp: $ts
              }]
            }')
          curl -sf -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"

      # TEMPORARY - for verifying Discord delivery end-to-end, removed after confirming
      - name: Push test ping
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PAYLOAD=$(jq -n \
            --arg title "🦉 Athena Contribution" \
            --arg desc "✅ Push-trigger test — verifying the Discord webhook end-to-end." \
            --arg repo "$REPO" \
            --arg ts "$TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 3066993,
                fields: [
                  { name: "Repository", value: $repo }
                ],
                timestamp: $ts
              }]
            }')
          curl -sf -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"

      - name: Manual test ping
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PAYLOAD=$(jq -n \
            --arg title "🦉 Athena Contribution" \
            --arg desc "✅ Test notification — Discord webhook is wired up correctly." \
            --arg repo "$REPO" \
            --arg ts "$TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 3066993,
                fields: [
                  { name: "Repository", value: $repo }
                ],
                timestamp: $ts
              }]
            }')
          curl -sf -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
